<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101A32" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Inversion: Echoes of Two Worlds</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #101a32;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        flex: none;
      }
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: #101a32;
        color: #c27aff;
        font-family: monospace;
        font-size: 18px;
        letter-spacing: 2px;
        text-align: center;
        text-transform: uppercase;
      }
      #rotate.visible {
        display: flex;
      }
      #rotate .phone {
        width: 28px;
        height: 48px;
        border: 3px solid #c27aff;
        border-radius: 4px;
        animation: turn 1.8s ease-in-out infinite;
      }
      @keyframes turn {
        0%,
        20% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="alert">
      <div class="phone"></div>
      <div>Rotate your device</div>
    </div>
    <noscript>Inversion needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
